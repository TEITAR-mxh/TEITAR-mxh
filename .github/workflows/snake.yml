name: Generate Snake Animation

on:
  schedule:
    # Runs every 12 hours (avoiding :00/:30 to reduce load peaks)
    - cron: "17 */12 * * *"

  # Allows manual trigger from GitHub Actions tab
  workflow_dispatch:

  # Runs on push to main (updates snake when README changes)
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake.svg (dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#58A6FF&color_dots=#30363D,#484F58,#30363D,#21262D,#0D1117
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#58A6FF

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
